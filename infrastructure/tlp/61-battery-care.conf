# Non-ThinkPad Lenovo laptops (ideapad_laptop driver) only expose a 3-way
# charge_types toggle (Fast/Standard/Long_Life) via the kernel's charge_types
# API introduced in kernel 6.17 — not an adjustable percentage like
# thinkpad_acpi's charge_control_end_threshold. 1 = Long_Life, which caps
# charging at a vendor-fixed point (no exact percentage control possible).
STOP_CHARGE_THRESH_BAT0=1
STOP_CHARGE_THRESH_BAT1=1
