# Installed to /etc/tlp.d/62-power.conf by apply-system.sh. Does not overlap with 61-battery-care.conf
# (that file only sets STOP_CHARGE_THRESH_*); drop-ins in /etc/tlp.d override /etc/tlp.conf.
#
# The suffix follows the tlp-pd PROFILE, not the power source (TLP 1.10, /etc/tlp.conf):
#   performance -> *_ON_AC   (the default profile on AC)
#   balanced    -> *_ON_BAT  (the default profile on battery)
#   power-saver -> *_ON_SAV  (on demand only)
# TLP leaves a setting untouched when the active profile has no value for it, so EVERY key is set for ALL three
# profiles: with only CPU_BOOST_ON_BAT=0 the CPU stayed capped at 2.0 GHz on AC after a battery session until
# reboot. EPP and platform profile point the same way in every profile (AMD: only one of them should win).
# Keep dynamic_epp off (kernel 7.1+: TLP's EPP writes fail with it on); no amd_prefcore setting (no-op on 7.2).

# performance (AC): balanced platform profile (cooler and quieter than "performance", long compiles ~5-10% slower)
PLATFORM_PROFILE_ON_AC=balanced
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_BOOST_ON_AC=1

# balanced (battery): low-power platform profile caps runaway loads; boost allowed (short bursts finish sooner)
PLATFORM_PROFILE_ON_BAT=low-power
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_BOOST_ON_BAT=1

# power-saver (on demand): the old battery behaviour, 2.0 GHz cap
PLATFORM_PROFILE_ON_SAV=low-power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0
