# State of the login screen (installed as /etc/tmpfiles.d/greeter.conf): HOME, cache, state and log of the user "greeter".
# /var/cache/tuigreet (remembered user of the text fallback) comes from the greetd package itself.
d /var/lib/greeter 0750 greeter greeter -
d /var/lib/greeter/cache 0750 greeter greeter -
d /var/lib/greeter/state 0750 greeter greeter -
