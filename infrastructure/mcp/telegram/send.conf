# Drop-in of telegram-mcp.service: the credentials of the owner-confirmed send route (/x-send). Installed by
# /usr/local/lib/telegram-mcp/creds-install only while BOTH credentials exist (a missing file would fail the unit), so the
# base unit stays valid without them. Source: infrastructure/mcp/telegram/send.conf.
[Service]
LoadCredentialEncrypted=send_token:/etc/credstore.encrypted/telegram-mcp.send_token
LoadCredentialEncrypted=send_allowlist:/etc/credstore.encrypted/telegram-mcp.send_allowlist
