# ghostty config of the tgconfirm popup (installed next to the palette of themes/generated/black/ghostty.conf, see
# apply-system.sh section mcp). The popup runs as the user tgconfirm with --config-default-files=false, so nothing of the
# owner's ghostty config applies: no shell integration, no keybinds of any kind, no clipboard access, no tabs or splits.
term = xterm-256color
font-family = JetBrainsMono Nerd Font
font-size = 15
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
window-decoration = none
confirm-close-surface = false
quit-after-last-window-closed = true
window-save-state = never
resize-overlay = never
shell-integration = none
clipboard-read = deny
clipboard-write = deny
mouse-hide-while-typing = true
cursor-style = block
cursor-style-blink = false
bell-features = no-system
keybind = clear
