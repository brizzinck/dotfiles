# Installed to /etc/systemd/system/v2raya.service.d/10-loopback.conf by apply-system.sh --only net.
# v2rayA's web UI listens on 0.0.0.0:2017 by default, so everyone on the LAN could open it. V2RAYA_ADDRESS is the
# package's own setting (see /etc/default/v2raya); a drop-in is used instead of editing that package file.
# The Environment= of a drop-in applies unless /etc/default/v2raya (EnvironmentFile=) sets the same variable.
[Service]
Environment=V2RAYA_ADDRESS=127.0.0.1:2017
