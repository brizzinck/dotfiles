# Installed to /etc/systemd/resolved.conf.d/10-no-llmnr.conf by apply-system.sh --only net.
# LLMNR (UDP/TCP 5355 on every interface) is Windows-style name lookup on the LAN: nothing here needs it, and it
# answers queries from any host on the network. MulticastDNS is left as it was (.local lookups; with the firewall
# on, only the mDNS multicast group 224.0.0.251:5353 gets through, see ufw before.rules).
[Resolve]
LLMNR=no
