# Wi-Fi regulatory domain (installed by apply-system.sh --only net to /etc/modprobe.d/cfg80211-regdom.conf).
# Without a country the kernel uses the world domain 00, where every 5 GHz channel is passive (no-IR) and
# 5 GHz access points are often not found. Needs the wireless-regdb package (regulatory.db).
options cfg80211 ieee80211_regdom=UA
