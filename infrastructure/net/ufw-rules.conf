# Extra ufw rules applied by apply-system.sh --only net, one per line, exactly the arguments of `ufw`
# (so a line "allow in on tailscale0" runs `ufw allow in on tailscale0`; ufw skips a rule that already exists).
# Empty on purpose: the policy is "deny incoming, allow outgoing", and ufw's own before.rules already accept
#   - loopback (-i lo), established/related traffic, the needed ICMP / ICMPv6 (neighbour discovery),
#   - DHCP / DHCPv6 replies, and the mDNS (224.0.0.251:5353) and SSDP (239.255.255.250:1900) multicast groups.
# Rules are only ever ADDED from here; removing a line does not remove the rule (sudo ufw status numbered, sudo ufw delete N).
# doctor net-exposure fails on a rule in /etc/ufw/user.rules that this file does not account for.
#
# Docker: container traffic to the internet and the host's published ports keep working, see CLAUDE.md "Firewall".
# Containers that must reach a service of the HOST (host.docker.internal / the bridge gateway 172.x.0.1) are blocked
# by default-deny INPUT: no compose file under ~/job needs that today. If one does, allow only its bridge, e.g.
#   allow in on docker0 to any port 5432 proto tcp
#   allow in on br-+ to any port 5432 proto tcp     (user-defined compose networks; "+" is an iptables wildcard)
#
# --- disabled by default: uncomment the lines when the program is installed and used ---------------------------
# Tailscale: trust everything that arrives over the tailnet interface (add ACLs on the tailnet side instead)
#allow in on tailscale0
# KDE Connect / GSConnect (1714-1764 tcp and udp). It must be reachable from the LAN, so keep it to your subnet:
#allow in from 192.168.1.0/24 to any port 1714:1764 proto tcp comment 'KDE Connect'
#allow in from 192.168.1.0/24 to any port 1714:1764 proto udp comment 'KDE Connect'
