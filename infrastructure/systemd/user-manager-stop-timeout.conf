# /etc/systemd/user.conf.d/10-dotfiles-stop-timeout.conf (apply-system.sh --only config): every user manager (the managed
# users td / yc have no stowed ~/.config/systemd/user.conf.d) kills a unit that ignores SIGTERM after 10 s instead of 90 s.
# Without it a tmux pane scope with a stuck nvim outlived user@UID.service's 30 s and the unit ended `failed (timeout)`.
[Manager]
DefaultTimeoutStopSec=10s
