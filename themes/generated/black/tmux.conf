# Everforest black (Everforest Black Refined): tmux colours. Generated by themes/palette/render.py from everforest.json. Do not edit.
# Sourced from tmux.conf through ~/.local/state/theme/current/tmux.conf (and re-sourced live by `theme`).
# Structure (positions, lengths, separators, borders lines, hooks) stays in tmux.conf.

# status bar
set -g status-style "bg=default,fg=#8d998f"
# badges: PREFIX (yellow), COPY (blue), ZOOM (purple); text on the badge is the background colour
set -g status-left "#{?client_prefix,#[fg=#000000]#[bg=#d9bc7f]#[bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#000000]#[bg=#83c3c8]#[bold] COPY #[default] ,}#{?window_zoomed_flag,#[fg=#dca0bb]#[bold]󰁌 ZOOM #[default],}"
# SYNC (red) + session name; throwaway term-* and all-digit (unnamed) sessions stay hidden, waybar owns the clock
set -g status-right "#{?pane_synchronized,#[fg=#e88384]#[bold]SYNC #[default],}#[fg=#6c7871]#{?#{||:#{m:term-*,#{session_name}},#{m/r:^[0-9]+$,#{session_name}}},,#{session_name}} "
# windows: workmux writes @workmux_status (status_format: false in workmux config), rendered here
set -g window-status-format "#[fg=#6c7871] #I #[fg=#8d998f]#W#{?@workmux_status, #{@workmux_status},}#{?window_bell_flag,#[fg=#e88384] 󰂞,} "
set -g window-status-current-format "#[bg=#151b18]#[fg=#abc682]#[bold] #I #[fg=#dbd8c9]#W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag,#[fg=#dca0bb] 󰁌,} #[default]"
# panes: quiet inactive borders (line); active = green, copy-mode = blue, synchronized = red
set -g pane-border-style "fg=#272f2b"
set -g pane-active-border-style "#{?pane_in_mode,fg=#83c3c8,#{?synchronize-panes,fg=#e88384,fg=#abc682}}"
# pane titles on borders: active green, others muted
set -g pane-border-format "#{?pane_active,#[fg=#abc682]#[bold],#[fg=#6c7871]} #{pane_index} #{pane_current_command}#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},#{host_short}}}}, · #{=/32/…:pane_title},} "
# messages, copy mode, popups, menus
set -g message-style "fg=#d9bc7f,bg=#000000"
set -g message-command-style "fg=#83c3c8,bg=#000000"
set -g mode-style "fg=#dbd8c9,bg=#28352d"
set -g copy-mode-match-style "fg=#000000,bg=#83c3c8"
set -g copy-mode-current-match-style "fg=#000000,bg=#d9bc7f"
set -g copy-mode-mark-style "fg=#000000,bg=#e88384"
# tmux 3.8 defaults popup-style to bg=themedarkgrey (a grey derived from the terminal), hence explicit palette colours
set -g popup-style "fg=#dbd8c9,bg=#000000"
# the other tmux 3.8 "theme" greys (choose-tree, scrollbars, display-panes, unused client area) on palette tokens
set -g display-panes-border-style "fg=#3e4843"
set -g pane-scrollbars-style "fg=#3e4843,width=1,pad=0"
set -g tree-mode-border-style "fg=#3e4843"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#e88384,#83c3c8}"
set -g copy-mode-line-number-style "fg=#6c7871,dim"
set -g copy-mode-current-line-number-style "fg=#d9bc7f"
set -g fill-character " "
set -g popup-border-style "fg=#3e4843"
set -g menu-style "fg=#dbd8c9,bg=#000000"
set -g menu-selected-style "fg=#000000,bg=#abc682"
set -g menu-border-style "fg=#3e4843"
set -g display-panes-active-colour "#abc682"
set -g display-panes-colour "#3e4843"
set -g clock-mode-colour "#abc682"
