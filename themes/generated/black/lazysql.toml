# lazysql theme: Everforest black. Generated by themes/palette/render.py. Do not edit.
# The `db` launcher copies this block into its per-run config (~/.local/state/theme/current/lazysql.toml), so a theme switch
# reaches the next start. Key names: lazysql README "Themes". `default` = the terminal's own colour (bg of the terminal).
