# wlr-which-key look: Everforest black. Generated by themes/palette/render.py. Do not edit.
# Every key of a wlr-which-key config except `menu:`; `.config/hub/leader` appends the menu it builds from the hub rows.
font: JetBrainsMono Nerd Font 13
background: "#000000f2"
color: "#dbd8c9"
border: "#abc682"
separator: " -> "
border_width: 2
corner_r: 6
padding: 18
rows_per_column: 12
column_padding: 28
anchor: center
namespace: "wlr_which_key"
# the leader menu owns the keyboard while it is open; every key also works on the ua and ru layouts
inhibit_compositor_keyboard_shortcuts: true
auto_kbd_layout: true
