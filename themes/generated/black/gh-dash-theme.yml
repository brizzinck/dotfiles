# gh-dash theme: Everforest black. Generated by themes/palette/render.py. Do not edit.
# Only the top-level `theme:` key lives here: `forge` concatenates ~/.config/gh-dash/base.yml (no `theme:`) and this file into
# the per-run config (tests check that the result holds exactly one `theme:`).
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
  colors:
    text:
      primary: "#dbd8c9"
      secondary: "#abc682"
      inverted: "#000000"
      faint: "#6c7871"
      warning: "#d9bc7f"
      success: "#abc682"
      error: "#e88384"
      actor: "#83c3c8"
    background:
      selected: "#1e2822"
    border:
      primary: "#272f2b"
      secondary: "#3e4843"
      faint: "#272f2b"
    icon:
      newcontributor: "#8cc69c"
      contributor: "#83c3c8"
      collaborator: "#dca0bb"
      member: "#d9bc7f"
      owner: "#ea9e77"
      unknownrole: "#6c7871"
