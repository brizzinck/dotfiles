# Everforest black colours for Hyprland. Generated by themes/palette/render.py. Do not edit.
# Sourced by .config/hypr/hyprland.conf (black fallback first, then the active variant).
# Roles: focus = green -> aqua gradient, inactive border = line, floats/groups inactive = border, groups = purple.
general {
    col.active_border = rgb(abc682) rgb(8cc69c) 45deg
    col.inactive_border = rgb(272f2b)
    col.nogroup_border = rgb(3e4843)
    col.nogroup_border_active = rgb(d9bc7f)
}

decoration {
    shadow {
        color = rgba(abc6822e)          # faint green glow, focused window only
    }
}

group {
    col.border_active = rgb(dca0bb)
    col.border_inactive = rgb(3e4843)
    col.border_locked_active = rgb(dca0bb)
    col.border_locked_inactive = rgb(3e4843)

    groupbar {
        col.active = rgb(dca0bb)
        col.inactive = rgb(3e4843)
        col.locked_active = rgb(dca0bb)
        col.locked_inactive = rgb(3e4843)
        text_color = rgb(dbd8c9)
        text_color_inactive = rgb(8d998f)
    }
}

misc {
    background_color = rgb(000000)   # always pure black, also with the night variant
}
