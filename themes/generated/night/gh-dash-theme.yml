# gh-dash theme: Everforest night. Generated by themes/palette/render.py. Do not edit.
# Only the top-level `theme:` key lives here: `forge` concatenates ~/.config/gh-dash/base.yml (no `theme:`) and this file into
# the per-run config (tests check that the result holds exactly one `theme:`).
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
  colors:
    text:
      primary: "#dbd8c9"
      secondary: "#abc682"
      inverted: "#0a0e0c"
      faint: "#6f7b74"
      warning: "#d9bc7f"
      success: "#abc682"
      error: "#e88384"
      actor: "#83c3c8"
    background:
      selected: "#212c26"
    border:
      primary: "#2c3430"
      secondary: "#424c47"
      faint: "#2c3430"
    icon:
      newcontributor: "#8cc69c"
      contributor: "#83c3c8"
      collaborator: "#dca0bb"
      member: "#d9bc7f"
      owner: "#ea9e77"
      unknownrole: "#6f7b74"
