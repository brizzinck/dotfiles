[env]
TERM = "xterm-256color"
# Palette: Everforest, variant black (default) or night, see themes/palette. Colours come from generated fragments;
# imports are applied in order, so the active variant (symlink flipped by `theme black|night`) overrides the
# black fallback that covers a missing link.
[general]
import = [
  "~/dotfiles/themes/generated/black/alacritty.toml",
  "~/.local/state/theme/current/alacritty.toml",
]

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[terminal]
shell = "zsh"

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Super|Shift"

[selection]
save_to_clipboard = true

[window]
startup_mode = "Maximized"

[font]
size = 15

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.padding]
x = 8
y = 6
