# Local LLM server settings (DEV-e), read by `llm _serve` (llm-server.service). key=value, `#` comments. Only these keys exist;
# anything else is ignored with a journal warning. Everything else is fixed on purpose (unix socket only, one slot, no prompt
# cache in RAM, no web UI, offline, reasoning off; see CLAUDE.md "Local LLM"). To change a value for this machine only, copy
# the line into ~/.config/llm/server.local.conf (read after this file, not tracked).
#
# context window in tokens (one request; the KV cache is allocated for all of it, so this is the main GPU memory knob)
ctx=8192
# CPU threads for the tokens that do not run on the GPU (generation and prompt are on Vulkan with -ngl all)
threads=4
# flash attention: auto | on | off
flash_attn=auto
# layers on the GPU: all | a number (0 = CPU only, for a machine without Vulkan)
gpu_layers=all
# idle timeout is NOT a server setting: llm-proxy.service has `--exit-idle-time=5min`; to change it use
#   systemctl --user edit llm-proxy.service   (ExecStart= line with another --exit-idle-time)
