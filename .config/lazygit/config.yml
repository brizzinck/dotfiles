# palette: everforest-black (themes/static/everforest-black); lazygit v0.60 keys
gui:
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor: ["#a7c080", bold]
    inactiveBorderColor: ["#3a4440"]
    searchingActiveBorderColor: ["#dbbc7f", bold]
    optionsTextColor: ["#7fbbb3"]
    selectedLineBgColor: ["#1f2a24"]
    inactiveViewSelectedLineBgColor: ["#141a17"]
    cherryPickedCommitFgColor: ["#000000"]
    cherryPickedCommitBgColor: ["#83c092"]
    markedBaseCommitFgColor: ["#000000"]
    markedBaseCommitBgColor: ["#dbbc7f"]
    unstagedChangesColor: ["#e67e80"]
    defaultFgColor: ["#d3c6aa"]
git:
  pagers:
    # pager.sh uses delta when installed and falls back to plain git output
    - pager: ~/.config/lazygit/pager.sh
