# lazygit v0.60 - structure only. The colours (gui.theme) are generated from the palette (themes/palette, lazygit.yml
# of the active variant) and merged after this file through LG_CONFIG_FILE, which .zshrc, tmux and hub set when
# ~/.local/state/theme/current/lazygit.yml exists (lazygit refuses a list with a missing file, so it is only set then).
gui:
  nerdFontsVersion: "3"
  border: rounded
git:
  pagers:
    # pager.sh uses delta when installed and falls back to plain git output
    - pager: ~/.config/lazygit/pager.sh
