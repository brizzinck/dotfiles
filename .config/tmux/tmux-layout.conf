# generated by ~/dotfiles/.config/layout/layout.py from keymap.tsv, do not edit (run: layout.py gen)
# Sourced at the end of tmux.conf (after the plugins). Every letter / M-letter binding in the
# prefix, copy-mode and copy-mode-vi tables gets its ua/ru twin: tmux receives the Cyrillic character
