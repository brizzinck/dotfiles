# ── tmux.conf ─ agent cockpit ──────────────────────────────────────────────
# Prefix: C-Space (C-a would eat Neovim's increment, C-b is awkward)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal / colors ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB,alacritty:RGB"
set -g allow-passthrough on          # OSC52 clipboard from nvim
set -sg escape-time 10               # snappy <Esc> in nvim
set -g repeat-time 300
set -g focus-events on               # nvim autoread + sidekick file watch
set -g history-limit 100000
set -g mouse on

# ── Windows / panes ────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename on          # workmux / sidekick write agent status into names
set -g status-interval 2
set -g status-position top
set -g status-style "bg=default,fg=#a7c080"
set -g window-status-current-style "fg=#dbbc7f,bold"
set -g status-left "#[fg=#7fbbb3][#S] "
set -g status-right "#[fg=#859289]%H:%M "

# Splits open in the current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Resize panes with prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── vim-tmux-navigator: C-h/j/k/l move between nvim splits and tmux panes ─
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ── Fast window switching (no prefix) ──────────────────────────────────────
# Alt+h / Alt+l  — previous / next window;  Alt+Space — last window
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-Space last-window
# Alt+1..9 — jump to window N. Inside nvim these keys still switch nvim tabs.
bind -n M-1 if-shell "$is_vim" 'send-keys M-1' 'select-window -t 1'
bind -n M-2 if-shell "$is_vim" 'send-keys M-2' 'select-window -t 2'
bind -n M-3 if-shell "$is_vim" 'send-keys M-3' 'select-window -t 3'
bind -n M-4 if-shell "$is_vim" 'send-keys M-4' 'select-window -t 4'
bind -n M-5 if-shell "$is_vim" 'send-keys M-5' 'select-window -t 5'
bind -n M-6 if-shell "$is_vim" 'send-keys M-6' 'select-window -t 6'
bind -n M-7 if-shell "$is_vim" 'send-keys M-7' 'select-window -t 7'
bind -n M-8 if-shell "$is_vim" 'send-keys M-8' 'select-window -t 8'
bind -n M-9 if-shell "$is_vim" 'send-keys M-9' 'select-window -t 9'
# prefix + Tab — last window;  prefix + w — interactive window/session tree (default)
bind Tab last-window
# Alt+Shift+h / Alt+Shift+l — move current window left / right
bind -n M-H swap-window -t -1 \; select-window -t -1
bind -n M-L swap-window -t +1 \; select-window -t +1

# ── Copy mode (vi) → Wayland clipboard ─────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore windows (agent panes survive reboot)
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Install TPM if missing, then load plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
