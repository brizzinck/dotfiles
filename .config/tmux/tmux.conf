# ── tmux.conf ─ agent cockpit ──────────────────────────────────────────────
# Prefix: C-Space (C-a would eat Neovim's increment, C-b is awkward)
unbind C-b
set -g prefix C-Space
bind -N "Send the prefix key to the program inside" C-Space send-prefix

# ── Terminal / colors ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB,alacritty:RGB"
# Extended keys (K4): a pane app that asks for them (Claude Code, Codex, nvim: modifyOtherKeys) gets Shift+Enter (newline in
# Claude Code; plain \r without this), Ctrl+Enter and Ctrl+Shift chords in the xterm form ghostty sends outside tmux
# (CSI 27;mod;key ~, so the format stays `xterm`). `on`, not `always`: every other pane (zsh, fzf, lazygit) keeps the legacy
# bytes. No tmux bind uses a Ctrl+Shift or Shift+Enter key. Tested in a private server inside ghostty on us and ua: Ctrl+letter
# reaches the app as the us letter on ua/ru too, Alt+letter (ghostty twins), the prefix and the M-/C- binds behave as before.
set -s extended-keys on
set -g allow-passthrough on          # OSC52 clipboard from nvim
set -g set-clipboard off             # tmux's own OSC52 handling double-answers alongside
                                      # allow-passthrough, duplicating query replies into
                                      # the pane as literal text (nested nvim :terminal)
set -sg escape-time 10               # snappy <Esc> in nvim
set -g repeat-time 300
set -g focus-events on               # nvim autoread + sidekick file watch
set -g history-limit 20000          # per pane; 100k x agent TUIs x resurrect-capture-pane-contents ballooned RAM
set -g mouse on

# ── Windows / panes ────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename on          # workmux / sidekick write agent status into names
set -g status-interval 2

# ── Style: Everforest (colours are generated, see themes/palette) ───────────
# outer terminals (ghostty reports xterm-256color): styled underlines (nvim undercurl), OSC 8 links
set -s terminal-features[10] "xterm-256color:RGB:usstyle:hyperlinks:strikethrough:overline:sync"
set -s terminal-features[11] "xterm-ghostty:RGB:usstyle:hyperlinks:strikethrough:overline:sync"

set -g status-position top
set -g status-justify absolute-centre   # window list centered on full bar width (ignores left/right asymmetry); M-H/M-L still reorder in place
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
set -g pane-border-lines single
set -g pane-border-indicators arrows
# pane titles on borders, only in windows with 2+ panes (hooks below toggle it per window)
set -g pane-border-status off
set-hook -g after-split-window  'if-shell -F "#{>:#{window_panes},1}" "set-option -w pane-border-status top"'
set-hook -g after-kill-pane     'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
set-hook -g pane-exited         'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off"'
set -g popup-border-lines rounded
set -g menu-border-lines rounded

# Colours: the active variant (black | night) is the symlink ~/.local/state/theme/current, flipped by the `theme`
# command (~/.local/bin/theme), which also re-sources this fragment in every running tmux server.
# A missing link is repaired with `theme init` (black) before the fragment is read.
if-shell '! test -r ~/.local/state/theme/current/tmux.conf' 'run-shell "~/.local/bin/theme init"'
source-file -q ~/.local/state/theme/current/tmux.conf
# per-user overrides that are never shared (usr link writes the accent marker of a managed user's status bar here)
source-file -q ~/.tmux.local.conf
# fzf inherits the active variant's colours in every popup and new pane (existing shells get it from .zshrc)
run-shell 'tmux set-environment -g FZF_DEFAULT_OPTS_FILE "$HOME/.local/state/theme/current/fzfrc"'
# lazygit colours (merged after its structural config by LG_CONFIG_FILE; only when the generated file exists)
run-shell '[ -r "$HOME/.local/state/theme/current/lazygit.yml" ] && tmux set-environment -g LG_CONFIG_FILE "$HOME/.config/lazygit/config.yml,$HOME/.local/state/theme/current/lazygit.yml"'

# agent attention: bell from a background window → red bell in the window list
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# A terminal window owns its term-* session (SUPER+Return): closing the ghostty window destroys it with everything in it.
# No `-t`: in a hook the new session is the current target, while tmux does not expand formats in `-t` (the old
# `-t "#{session_name}"` matched no session, so the option was never set). doctor checks it in a private server.
set-hook -g session-created 'if-shell -F "#{m:term-*,#{session_name}}" "set-option destroy-unattached on"'

# Create new named session with mandatory unique name (prefix+C)
bind -N "New named session (name is mandatory and unique)" C command-prompt -p "new session name:" "run-shell '~/.config/tmux/scripts/new-session.sh \"%1\"'"

# Projects (prefix+F): pj lists sessions, repos, worktrees and zoxide dirs; Enter switches to or creates the session (SUPER+P is the same list)
bind -N "Projects: switch to or create the tmux session of a repo, worktree or directory" F display-popup -E -w 85% -h 75% -d "#{pane_current_path}" "~/.local/bin/pj --here --client '#{client_name}'"
# URL picker (prefix+u): open/copy a URL from the pane scrollback
bind -N "URL picker from the pane scrollback (Enter opens, Ctrl-y copies)" u display-popup -E -w 80% -h 60% "~/.config/tmux/scripts/url-picker.sh '#{pane_id}'"
# Utility hub (prefix+m, same list as SUPER+M; replaces the rarely used mark-pane)
bind -N "Utility hub popup (same list as SUPER+M)" m display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/.config/hub/hub --fzf"
# Project environments and secrets (prefix+v): the envs TUI in the pane's directory (a project there opens at its environments)
bind -N "Project environments and secrets (envs) in the pane's directory" v display-popup -E -w 85% -h 75% -d "#{pane_current_path}" "~/.local/bin/envs"
bind -N "Databases of this project (db: lazysql, container clients) in the pane's directory" b display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "~/.local/bin/db"
bind -N "API client of this project (posting) in the pane's directory" a display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "~/.local/bin/api"
# Popup shell in the pane's directory (prefix+`)
bind -N "Popup shell in the pane's directory" '`' display-popup -E -d "#{pane_current_path}" -w 80% -h 70%

# Kill session picker (prefix+X / prefix+Ctrl-x)
bind -N "Kill-session picker" X display-popup -w 85% -h 70% -E "bash ~/.config/tmux/scripts/kill-session.sh"
bind -N "Kill-session picker" C-x display-popup -w 85% -h 70% -E "bash ~/.config/tmux/scripts/kill-session.sh"

# Kill current session (prefix+Q) and land in a fresh unnamed session (unsaved)
bind -N "Kill the current session (confirm) and land in a fresh one" Q confirm-before -p "kill session '#S'? (y/n)" {
  run-shell "bash ~/.config/tmux/scripts/kill-and-new.sh '#{session_name}' '#{pane_current_path}'"
}

# Save current session as snapshot '<session>' (overwrites), then create + switch to a new
# unnamed session (prefix+N). The new session stays unsaved until you save it yourself.
# An unnamed current session has nothing to save under, so only then a name is asked.
bind -N "Save the current session as a snapshot, then start a new unnamed one" N if-shell -F "#{m/r:^[0-9]+$,#{session_name}}" {
  command-prompt -p "save as:" { run-shell "bash ~/.config/tmux/scripts/save-and-new.sh '#{session_name}' '#{pane_current_path}' '%1'" }
} {
  run-shell "bash ~/.config/tmux/scripts/save-and-new.sh '#{session_name}' '#{pane_current_path}'"
}

# Splits open in the current pane's path
bind -N "Split right in the current directory" | split-window -h -c "#{pane_current_path}"
bind -N "Split below in the current directory" - split-window -v -c "#{pane_current_path}"
bind -N "New window in the current directory" c new-window -c "#{pane_current_path}"
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── App windows: lazygit / lazydocker / yazi ───────────────────────────────
bind -N "New window running lazygit" g new-window -n lazygit -c "#{pane_current_path}" lazygit
bind -N "New window running lazydocker" d new-window -n lazydocker -c "#{pane_current_path}" lazydocker
bind -N "New window running yazi" y new-window -n yazi -c "#{pane_current_path}" yazi

# d is now lazydocker above, so detach-client moves to D (was choose-client)
bind -N "Detach" D detach-client

# Resize panes with prefix + H/J/K/L (repeatable)
bind -N "Resize pane left by 5 (repeatable)" -r H resize-pane -L 5
bind -N "Resize pane down by 5 (repeatable)" -r J resize-pane -D 5
bind -N "Resize pane up by 5 (repeatable)" -r K resize-pane -U 5
bind -N "Resize pane right by 5 (repeatable)" -r L resize-pane -R 5

# ── vim-tmux-navigator: C-h/j/k/l move between nvim splits and tmux panes ─
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -N "Move to the pane on the left (passes through to nvim splits)" -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -N "Move to the pane below (passes through to nvim splits)" -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -N "Move to the pane above (passes through to nvim splits)" -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -N "Move to the pane on the right (passes through to nvim splits)" -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -N "Move to the pane on the left" -T copy-mode-vi C-h select-pane -L
bind -N "Move to the pane below" -T copy-mode-vi C-j select-pane -D
bind -N "Move to the pane above" -T copy-mode-vi C-k select-pane -U
bind -N "Move to the pane on the right" -T copy-mode-vi C-l select-pane -R

# ── Fast window switching (no prefix) ──────────────────────────────────────
# Alt+h / Alt+l  — previous / next window;  Alt+Space — last window
bind -N "Previous window" -n M-h previous-window
bind -N "Next window" -n M-l next-window
bind -N "Last window" -n M-Space last-window
# Alt+1..9 — jump to window N (always tmux; nvim tabs use ]t / [t)
bind -N "Jump to window 1" -n M-1 select-window -t 1
bind -N "Jump to window 2" -n M-2 select-window -t 2
bind -N "Jump to window 3" -n M-3 select-window -t 3
bind -N "Jump to window 4" -n M-4 select-window -t 4
bind -N "Jump to window 5" -n M-5 select-window -t 5
bind -N "Jump to window 6" -n M-6 select-window -t 6
bind -N "Jump to window 7" -n M-7 select-window -t 7
bind -N "Jump to window 8" -n M-8 select-window -t 8
bind -N "Jump to window 9" -n M-9 select-window -t 9
# prefix + Tab — last window;  prefix + w — interactive window/session tree (default)
bind -N "Last window" Tab last-window
# Alt+Shift+h / Alt+Shift+l — move current window left / right
bind -N "Move the window left" -n M-H swap-window -t -1 \; select-window -t -1
bind -N "Move the window right" -n M-L swap-window -t +1 \; select-window -t +1

# ── Named snapshots (saved only explicitly with a unique name) ─────────────
# prefix+S / prefix+Ctrl-s saves with mandatory unique name
# prefix+R / prefix+Ctrl-r opens an fzf picker with preview (and snapshot deletion via 'd' / 'x')
set -g @resurrect-save ''
set -g @resurrect-restore ''
bind -N "Save a named snapshot of the sessions" S command-prompt -p "snapshot name:" "run-shell '~/.config/tmux/scripts/snapshot-save.sh \"%1\"'"
bind -N "Save a named snapshot of the sessions" C-s command-prompt -p "snapshot name:" "run-shell '~/.config/tmux/scripts/snapshot-save.sh \"%1\"'"
bind -N "Restore a snapshot (fzf, d / x deletes)" R display-popup -w 90% -h 70% -E "bash ~/.config/tmux/scripts/snapshot-restore.sh"
bind -N "Restore a snapshot (fzf, d / x deletes)" C-r display-popup -w 90% -h 70% -E "bash ~/.config/tmux/scripts/snapshot-restore.sh"

# ── Copy mode (vi) → Wayland clipboard ─────────────────────────────────────
setw -g mode-keys vi
# prefix [ and prefix Escape enter copy mode (vi keys: hjkl, w b e, 0 $, g G, / ? n N, f t, Ctrl-d/u, H M L)
bind -N "Copy mode (vi)" [ copy-mode
bind -N "Copy mode (vi)" Escape copy-mode
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Select the line" -T copy-mode-vi V send -X select-line
bind -N "Toggle rectangle selection" -T copy-mode-vi C-v send -X rectangle-toggle
bind -N "Copy to the Wayland clipboard and leave" -T copy-mode-vi y send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"
bind -N "Leave copy mode" -T copy-mode-vi Escape send -X cancel

# Mouse drag selection: copy to clipboard on mouse release
bind -N "Mouse drag selection copies to the clipboard" -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"
bind -N "Mouse drag selection copies to the clipboard" -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"

# Double-click (word) and triple-click (line) copy to clipboard
bind -N "Double click copies the word" -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"
bind -N "Double click copies the word" -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"
bind -N "Triple click copies the line" -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"
bind -N "Triple click copies the line" -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh"

bind -N "Double click copies the word" -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh" }
bind -N "Triple click copies the line" -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/copy-clipboard.sh" }

# ── Hints: tmux-fingers (prefix f) ─────────────────────────────────────────
# vimium-style hints for URLs, paths, git SHAs, IPs, UUIDs, hex and numbers in the visible pane: press the hint letter to copy
# (Wayland clipboard + primary through copy-clipboard.sh), Ctrl+letter opens (xdg-open), Shift+letter pastes into the pane,
# Tab = multi-select, Space = fzf, q / Esc leave. prefix j = jump mode (cursor goes to the match in copy mode).
# Installed as the AUR package `tmux-fingers` (Crystal, built from the pinned source tarball by yay; no curl installer,
# no TPM wizard): apply-system.sh --only install. Until it is installed prefix f stays tmux's own find-window.
# Hint styles use ANSI colours, so both theme variants follow the terminal palette.
set -g @fingers-key f
set -g @fingers-jump-key j                    # J is pane resize
set -g @fingers-main-action "$HOME/.config/tmux/scripts/copy-clipboard.sh"
set -g @fingers-ctrl-action ':open:'
set -g @fingers-shift-action ':paste:'
set -g @fingers-hint-style 'fg=green,bold'
set -g @fingers-highlight-style 'fg=yellow'
set -g @fingers-backdrop-style 'fg=colour8'                  # ANSI 8 = muted
set -g @fingers-selected-hint-style 'fg=blue,bold'
set -g @fingers-selected-highlight-style 'fg=blue'
if-shell 'command -v tmux-fingers >/dev/null 2>&1' 'run-shell "tmux-fingers load-config"'

# ── Plugins (TPM) ──────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore windows (agent panes survive reboot)
set -g @resurrect-capture-pane-contents 'on'
# continuum autosave disabled: saves happen only manually via prefix+S / prefix+C-s
set -g @continuum-save-interval '0'
set -g @continuum-restore 'off'

set -g @plugin 'tmux-plugins/tmux-sidebar'     # prefix+e: file-tree pane (mirrors nvim's <leader>e)
set -g @sidebar-tree 'e'                       # default is Tab, which we use for last-window
set -g @sidebar-tree-focus 'E'                 # default is Backspace
set -g @sidebar-tree-command 'tree -C'
set -g @sidebar-tree-width '50'

# Install TPM if missing, then load plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'

# Cyrillic (ua/ru) twins of the letter binds, generated by ~/.config/layout/layout.py (after the plugins so their binds get twins too)
source-file -q ~/.config/tmux/tmux-layout.conf
