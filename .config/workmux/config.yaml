# workmux global config — one git worktree + one tmux window per agent task.
# Project overrides: .workmux.yaml in the repo (`workmux init`).
agent: claude

# Keep worktrees out of the repo tree, namespaced per project.
worktree_dir: ~/.workmux/{project}
worktree_naming: basename
window_prefix: "wm-"
window_placement: rightmost

# Layout: nvim on the left (focused), the agent on the right.
panes:
  - command: nvim
    focus: true
  - command: <agent>
    split: vertical
    size: 45

merge_strategy: rebase

# Status icons are rendered by tmux.conf (window-status-format shows #{@workmux_status}),
# so workmux must not rewrite the window formats itself. Glyphs are Nerd Font (accent hex = palette tokens yellow / orange / green, identical in both variants).
status_format: false
status_icons:
  working: "#[fg=#d9bc7f]󰚩#[fg=default]"
  waiting: "#[fg=#ea9e77]󰍡#[fg=default]"
  done: "#[fg=#abc682]#[fg=default]"
