<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="keymap-stamp" content="/*STAMP*/">
<title>Keymap</title>
<style>
/* Generated by .config/keymap/keymap.py from page.html; colours are the Everforest v2 tokens of the active theme variant
   (themes/generated/<variant>/tokens.css). No external fonts, scripts or requests: the page works offline. */
/*TOKENS*/
:root {
  --bg: var(--ef-bg); --surface: var(--ef-surface); --raised: var(--ef-raised); --line: var(--ef-line);
  --border: var(--ef-border); --fg: var(--ef-fg); --muted: var(--ef-muted); --sub: var(--ef-subtext);
  --accent: var(--ef-green); --accent-soft: var(--ef-select); --warn: var(--ef-yellow); --info: var(--ef-blue);
  --font-body: system-ui, -apple-system, "Segoe UI", "Noto Sans", "DejaVu Sans", sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  --step-0: 0.875rem; --step-1: 1rem; --step-2: 1.25rem; --step-3: 1.5rem;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.5; }
.wrap { max-width: 88rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px 8px; display: grid; gap: 8px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-size: var(--step-2); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); }
.searchrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mode { font-family: var(--font-mono); font-weight: 600; padding: 2px 6px; border-radius: 4px; color: var(--warn); border: 1px solid var(--line); min-width: 2.6em; text-align: center; }
.mode.ins { color: var(--accent); }
#q { flex: 1 1 16rem; min-width: 0; font: inherit; font-size: var(--step-1); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
#q:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hint { color: var(--muted); font-size: 0.8rem; }
.hint b { color: var(--sub); font-weight: 600; }
nav.chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 5.6rem; overflow-y: auto; scrollbar-width: thin; padding-bottom: 2px; }
nav.chips .g { flex: none; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; align-self: center; padding-left: 6px; }
nav.chips a { flex: none; color: var(--sub); text-decoration: none; font-size: 0.8rem; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; }
nav.chips a:hover, nav.chips a:focus-visible, nav.chips a.on { color: var(--fg); border-color: var(--accent); outline: none; }

main .wrap { padding-block: 20px 70px; }
.intro { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); margin-bottom: 26px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.rule h3 { margin: 0 0 4px; font-size: var(--step-0); font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; }
.rule p { margin: 0; color: var(--sub); }

h2.group { font-size: var(--step-3); font-weight: 600; margin: 34px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); letter-spacing: -0.01em; }
.grid { columns: 2 36rem; column-gap: 40px; }
section.sec { break-inside: avoid; margin: 0 0 28px; min-width: 0; scroll-margin-top: 11rem; }
section.sec h3 { font-size: var(--step-1); font-weight: 600; margin: 0 0 2px; text-wrap: balance; display: flex; align-items: baseline; gap: 10px; }
section.sec h3 .n { color: var(--muted); font-weight: 400; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
section.sec .note { color: var(--muted); margin: 0 0 8px; max-width: 68ch; }
.rows { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); column-gap: 16px; border-top: 1px solid var(--line); }
.row { display: contents; }
.row > div { padding: 5px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.keys { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; max-width: 21rem; }
.desc { overflow-wrap: anywhere; }
.desc .ctx { display: inline-block; font-size: 0.72rem; color: var(--warn); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.desc .nt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; color: var(--muted); font-size: 0.8rem; }
kbd { font-family: var(--font-mono); font-size: 0.78rem; font-weight: 500; background: var(--raised); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; line-height: 1.55; white-space: nowrap; }
.plus, .then, .or { color: var(--muted); font-size: 0.75rem; }
.then { padding: 0 2px; }
.or { padding: 0 3px; }
.raw { font-family: var(--font-mono); font-size: 0.8rem; }
.empty { color: var(--muted); padding: 30px 0; }
mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
footer { color: var(--muted); font-size: 0.78rem; margin-top: 30px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body data-variant="/*VARIANT*/">
<header class="top">
  <div class="wrap">
    <div class="titlerow">
      <h1>Keymap</h1>
      <span class="sub" id="sub"></span>
    </div>
    <div class="searchrow">
      <span class="mode" id="mode" title="NORMAL: j k scroll, / search. INSERT: typing filters, Esc back">[N]</span>
      <input id="q" type="search" placeholder="Filter: screenshot, tmux, Super+Shift, lsp..." autocomplete="off" spellcheck="false" aria-label="Filter shortcuts">
      <span class="count" id="count"></span>
    </div>
    <div class="hint">On this page: <b>/</b> filter · <b>Esc</b> back to NORMAL (twice clears) · <b>j k</b> scroll · <b>d u</b> half page · <b>g G</b> top / bottom · <b>[ ]</b> previous / next block</div>
    <nav class="chips" id="chips" aria-label="Blocks"></nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro" id="intro"></div>
    <div id="start"></div>
    <div id="groups"></div>
    <p class="empty" id="empty" hidden>No shortcut matches this filter.</p>
    <footer id="foot"></footer>
  </div>
</main>

<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

// keys: alts = [alternative = [chord = [key name, ...], ...], ...]; chord = pressed together, chords in a row = a sequence
function renderKeys(r) {
  if (r.raw) return `<span class="raw">${esc(r.keys)}</span>`;
  return r.alts.map(seq => seq.map(chord => chord.map(k => `<kbd>${esc(k)}</kbd>`).join('<span class="plus">+</span>'))
    .join('<span class="then">›</span>')).join('<span class="or">/</span>');
}
// search: the same rule as `keymap rows` (keymap.py search()): all words must match; a word matches a substring of the keys, the
// description, the block title / scope tag or the keywords; a word of one or two characters only a whole key or a whole word
function keyParts(r) {
  const p = new Set();
  for (const seq of r.alts || []) for (const chord of seq) for (const k of chord) {
    const l = k.toLowerCase(); p.add(l); for (const x of l.split("..")) if (x) p.add(x);
  }
  if (r.raw) for (const w of r.keys.toLowerCase().split(/[\s+/]+/)) if (w) p.add(w);
  return p;
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function matchWord(tok, f) {
  const short = tok.length <= 2;
  const word = new RegExp("\\b" + escRe(tok) + (short ? "\\b" : ""));
  return f.parts.has(tok) || (!short && f.keys.includes(tok)) || word.test(f.desc) || (!short && f.desc.includes(tok))
    || (short ? word.test(f.kw) : f.kw.includes(tok)) || (short ? word.test(f.blk) : f.blk.includes(tok));
}
function renderRow(r, blockTitle) {
  const el = document.createElement("div");
  el.className = "row";
  const b = blockOf[r.block] || {};
  el._f = { keys: r.keys.toLowerCase(), parts: keyParts(r), desc: r.desc.toLowerCase(), kw: (r.kw || "").toLowerCase(),
            blk: (blockTitle + " " + (b.scope || "")).toLowerCase() };
  el.innerHTML = `<div class="keys">${renderKeys(r)}</div><div class="desc">${r.ctx ? `<span class="ctx">${esc(r.ctx)}</span>` : ""}${esc(r.desc)}${r.note ? `<span class="nt" title="${esc(r.note)}">${esc(r.note)}</span>` : ""}</div>`;
  return el;
}

const byBlock = {};
for (const r of D.rows) (byBlock[r.block] = byBlock[r.block] || []).push(r);
const blockOf = Object.fromEntries(D.blocks.map(b => [b.id, b]));

$("sub").textContent = `Arch + Hyprland · Everforest ${D.variant} · ${D.rows.length} shortcuts · works on us, ua and ru layouts`;
$("intro").innerHTML = D.intro.map(c => `<div class="rule"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p></div>`).join("");

// Start here: the pinned keys, picked from the rows (a pin is the key text of a row)
const startRows = [];
for (const p of D.pins) {
  const r = D.rows.find(x => x.keys.toLowerCase() === p.toLowerCase());
  if (r) startRows.push(r);
}
const sections = [];
function makeSection(id, title, note, rows, titleOf) {
  const sec = document.createElement("section");
  sec.className = "sec"; sec.id = id;
  sec.innerHTML = `<h3>${esc(title)} <span class="n"></span></h3>` + (note ? `<p class="note">${esc(note)}</p>` : "") + `<div class="rows"></div>`;
  const box = sec.querySelector(".rows");
  for (const r of rows) box.appendChild(renderRow(r, titleOf ? titleOf(r) : title));
  sections.push(sec);
  return sec;
}
if (startRows.length) {
  const wrap = document.createElement("div"); wrap.className = "grid"; wrap.id = "startgrid";
  wrap.appendChild(makeSection("start", "Start here", "The keys you use all day.", startRows, r => blockOf[r.block].title));
  $("start").appendChild(wrap);
}
const chips = $("chips");
if (startRows.length) { const a = document.createElement("a"); a.href = "#start"; a.textContent = "Start here"; chips.appendChild(a); }
for (const g of D.groups) {
  const blocks = D.blocks.filter(b => b.group === g);
  if (!blocks.length) continue;
  const h = document.createElement("h2"); h.className = "group"; h.textContent = g; h.dataset.group = g;
  $("groups").appendChild(h);
  const grid = document.createElement("div"); grid.className = "grid"; grid.dataset.group = g;
  $("groups").appendChild(grid);
  const lab = document.createElement("span"); lab.className = "g"; lab.textContent = g; chips.appendChild(lab);
  for (const b of blocks) {
    grid.appendChild(makeSection(b.id, b.title, b.desc + (b.note ? " " + b.note : ""), byBlock[b.id] || []));
    const a = document.createElement("a"); a.href = "#" + b.id; a.textContent = b.title.replace(/^(Neovim|tmux): /, ""); a.title = b.title;
    chips.appendChild(a);
  }
}

const q = $("q"), count = $("count"), empty = $("empty"), mode = $("mode"), intro = $("intro");
const total = D.rows.length;
function apply() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const sec of sections) {
    let n = 0;
    for (const row of sec.querySelectorAll(".row")) {
      const hit = words.every(w => matchWord(w, row._f));
      row.hidden = !hit; if (hit) n++;
    }
    sec.hidden = n === 0 || (words.length > 0 && sec.id === "start"); // "Start here" repeats rows: hide it while filtering
    sec.querySelector(".n").textContent = words.length ? n : "";
    if (sec.id !== "start") shown += n;
  }
  for (const el of document.querySelectorAll("#groups > [data-group]")) {
    if (el.tagName === "H2") el.hidden = !sections.some(s => !s.hidden && s.parentNode.dataset.group === el.dataset.group);
  }
  for (const a of chips.querySelectorAll("a")) a.hidden = !!words.length && a.hash !== "" && document.querySelector(a.hash)?.hidden === true;
  intro.hidden = words.length > 0;
  $("start").hidden = words.length > 0;
  empty.hidden = shown > 0;
  count.textContent = words.length ? `${shown} of ${total}` : `${total} shortcuts`;
}
q.addEventListener("input", apply);
q.addEventListener("focus", () => { mode.textContent = "[I]"; mode.classList.add("ins"); });
q.addEventListener("blur", () => { mode.textContent = "[N]"; mode.classList.remove("ins"); });
q.addEventListener("keydown", e => {
  if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); q.blur(); }
  e.stopPropagation();
});

function visibleSections() { return sections.filter(s => !s.hidden); }
function jumpBlock(dir) {
  const secs = visibleSections();
  const top = window.scrollY + 140;
  let i = secs.findIndex(s => s.getBoundingClientRect().top + window.scrollY > top);
  if (dir > 0) { if (i < 0) return; secs[i].scrollIntoView(); }
  else { i = (i < 0 ? secs.length : i) - 2; if (i < 0) i = 0; secs[i].scrollIntoView(); }
}
// NORMAL-mode keys by physical key (e.code), so they work on the ua and ru layouts too
function normalKey(e) {
  if (e.target === q || e.ctrlKey || e.metaKey || e.altKey) return;
  const half = window.innerHeight / 2;
  switch (e.code) {
    case "Slash": e.preventDefault(); e.stopPropagation(); q.focus(); q.select(); break;
    case "KeyI": e.preventDefault(); e.stopPropagation(); q.focus(); break;
    case "KeyJ": e.preventDefault(); e.stopPropagation(); window.scrollBy(0, 70); break;
    case "KeyK": e.preventDefault(); e.stopPropagation(); window.scrollBy(0, -70); break;
    case "KeyD": e.preventDefault(); e.stopPropagation(); window.scrollBy(0, half); break;
    case "KeyU": e.preventDefault(); e.stopPropagation(); window.scrollBy(0, -half); break;
    case "KeyG": e.preventDefault(); e.stopPropagation(); window.scrollTo(0, e.shiftKey ? document.body.scrollHeight : 0); break;
    case "BracketRight": e.preventDefault(); e.stopPropagation(); jumpBlock(1); break;
    case "BracketLeft": e.preventDefault(); e.stopPropagation(); jumpBlock(-1); break;
    case "Escape": if (q.value) { q.value = ""; apply(); } break;
  }
}
// capture phase on window: a browser extension (Vimium C) must not get these keys first when it lets the page win
window.addEventListener("keydown", normalKey, true);
$("foot").textContent = `Generated ${D.generated} by keymap (.config/keymap/keymap.py); regenerate with: keymap gen`;
apply();
</script>
</body>
</html>
