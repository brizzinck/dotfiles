# Owner's user manager: a service that does not stop within 10 s is killed (default 90 s). With linger the user manager
# runs many services (MCP gateway, EasyEffects, voxtype, camoufox-gateway, ...); one that hangs on SIGTERM used to hold
# a reboot or poweroff for up to two minutes, which looked like "reboot does not work".
[Manager]
DefaultTimeoutStopSec=10s
