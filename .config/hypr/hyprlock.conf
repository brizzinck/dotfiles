# Pure-black lock screen (OLED). Palette: everforest-black.
general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    color = rgb(000000)
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(3a4440)
    inner_color = rgb(000000)
    font_color = rgb(d3c6aa)
    check_color = rgb(dbbc7f)
    fail_color = rgb(e67e80)
    capslock_color = rgb(e69875)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b7770">$LAYOUT · password</span>
    fail_text = <span foreground="##e67e80">$FAIL ($ATTEMPTS)</span>
    rounding = 8
    position = 0, 90
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(d3c6aa)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(859289)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(6b7770)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -24, 16
    halign = right
    valign = bottom
}
