# Pure-black lock screen (OLED). Palette: Everforest v2 tokens (bg_oled in both variants), see themes/palette.
# Palette variables ($ef_*): the black fragment is the fallback, the second one the active variant
# (~/.local/state/theme/current, flipped by `theme`; hyprlock reads this file at every start).
source = ~/dotfiles/themes/generated/black/hyprlock.conf
source = ~/.local/state/theme/current/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $ef_bg_oled
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = $ef_border
    inner_color = $ef_bg_oled
    font_color = $ef_fg
    check_color = $ef_yellow
    fail_color = $ef_red
    capslock_color = $ef_orange
    fade_on_empty = false
    placeholder_text = <span foreground="$ef_hex_muted">$LAYOUT · password</span>
    fail_text = <span foreground="$ef_hex_red">$FAIL ($ATTEMPTS)</span>
    rounding = 8
    position = 0, 90
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $ef_fg
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $ef_subtext
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $ef_muted
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -24, 16
    halign = right
    valign = bottom
}
