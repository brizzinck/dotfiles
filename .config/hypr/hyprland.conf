# Hyprland 0.56 (hyprlang). Palette: Everforest Black (themes/static/everforest-black).
# Monitors are static rules (no polling script); NVIDIA env lives in gpu-nvidia.conf,
# sourced through host.conf on NVIDIA machines only (install.sh does that).

# ───────────────────────────── monitors ─────────────────────────────
# With an HDMI monitor: HDMI on top at 0x0, the laptop panel below it.
# Without: only eDP-1 is present and the offset is harmless.
monitor = HDMI-A-1, 2560x1440@144, 0x0, 1
monitor = eDP-1, 2880x1800@120, 0x1440, 1.5
monitor = , preferred, auto, 1

# ───────────────────────────── programs ─────────────────────────────
$terminal = ghostty
$fileManagerTerminal = $terminal -e yazi
$fileManagerGUI = nemo
$menu = pkill rofi || rofi -show drun
$editor = nvim
$browser = flatpak run app.zen_browser.zen
$wallpaper = swaybg -i ~/pics/walls/lol.jpg
# Floating terminal for TUIs; matched by the float-tui window rule below
$tui = ghostty --class=float.tui -e
$scripts = ~/.config/hypr/scripts

# ───────────────────────────── autostart ────────────────────────────
exec-once = waybar & hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = ~/.config/hypr/td_clipboard_acl.sh
exec-once = dunst
exec-once = swayosd-server
exec-once = wl-paste --type text --watch cliphist -max-items 300 store
exec-once = wl-paste --type image --watch cliphist -max-items 300 store
exec-once = wl-clip-persist --clipboard regular
exec-once = easyeffects --service-mode --hide-window
exec-once = udiskie --tray --notify
exec-once = telegram-desktop -startintray
exec-once = pgrep swaybg && killall swaybg; $wallpaper

# ───────────────────────────── environment ──────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32

# Per-host overrides (NVIDIA: gpu-nvidia.conf). Must exist, may only hold comments.
source = ~/.config/hypr/host.conf

# ───────────────────────────── input ────────────────────────────────
input {
    touchpad {
        natural_scroll = true
    }

    kb_layout = us,ua,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1

    sensitivity = -0.1
}

# ───────────────────────────── look ─────────────────────────────────
general {
    gaps_in = 3
    gaps_out = 4
    border_size = 2
    col.active_border = rgb(a7c080) rgb(83c092) 45deg
    col.inactive_border = rgb(222a27)
    resize_on_border = true

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(a7c0802e)          # faint green glow, focused window only
        color_inactive = rgba(00000000)
    }

    blur {
        enabled = false                 # everything is opaque black
    }

    dim_inactive = true                 # on black only text dims
    dim_strength = 0.15
    dim_special = 0.5
}

group {
    col.border_active = rgb(d699b6)
    col.border_inactive = rgb(3a4440)

    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 18
        indicator_height = 2
        rounding = 4
        gradients = false
        col.active = rgb(d699b6)
        col.inactive = rgb(3a4440)
        text_color = rgb(d3c6aa)
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
}

cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

render {
    direct_scanout = 2                  # fullscreen video/games skip composition
}

xwayland {
    force_zero_scaling = true           # no X11 app is in regular use; crisp at scale 1.5
}

# Fast, not off: ~150-200 ms at 120 Hz
animations {
    enabled = true
    bezier = snap, 0.2, 0.9, 0.1, 1
    animation = global, 1, 2, snap
    animation = windows, 1, 1.5, snap, popin 92%
    animation = windowsOut, 1, 1.2, snap, popin 92%
    animation = border, 1, 2, snap
    animation = fade, 1, 1.5, snap
    animation = layers, 1, 1.2, snap, fade
    animation = workspaces, 1, 1.8, snap, slide
    animation = specialWorkspace, 1, 1.8, snap, slidevert
}

dwindle {
    preserve_split = yes
}

# ───────────────────────────── workspaces and rules ─────────────────
# Smart borders: no frame, no gaps and no glow for a lone tiled window
workspace = w[tv1], gapsout:0, gapsin:0
windowrule {
    name = smart-borders
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
    rounding = 0
    no_shadow = on
}

# Drop-down terminal: SUPER+Z toggles it, tmux session "scratch" is attached or created
workspace = special:term, gapsout:48, on-created-empty:ghostty -e tmux new-session -A -s scratch

# Floating TUIs ($tui)
windowrule {
    name = float-tui
    match:class = ^(float\.tui)$
    float = on
    center = on
    size = monitor_w*0.6 monitor_h*0.65
}

layerrule {
    name = rofi
    match:namespace = ^(rofi)$
    no_anim = on
    dim_around = on
}

# windowrule = float,^(org.telegram.desktop)$
# windowrule = size 1400 1250,^(org.telegram.desktop)$
# windowrule = center,^(org.telegram.desktop)$

# windowrule = float,^(swayimg)$
# windowrule = size 800 450,^(swayimg)$
# windowrule = center,^(swayimg)$

# windowrule = float,^(mpv)$
# windowrule = size 800 450,^(mpv)$
# windowrule = center,^(mpv)$

# windowrule = float,^(org.pulseaudio.pavucontrol)$
# windowrule = size 800 400,^(org.pulseaudio.pavucontrol)$
# windowrule = move 1700 50,^(org.pulseaudio.pavucontrol)$

# windowrule =  float,^(nemo)$

# windowrule = workspace 1,^(Spotify)$

# Chrome-vs-hypridle idle exemption lives in hypridle.conf now
# (windowrule `idleinhibit` was removed from Hyprland in 0.53+, moved to
# hypridle) — see condition_cmd -> no_idle_while_chrome.sh there.

# ───────────────────────────── keybinds ─────────────────────────────
# bindd = MODS, key, description, dispatcher, args   (descriptions feed SUPER+/ cheatsheet)
# d = description, e = repeat while held, l = works on the lock screen, m = mouse
# Descriptions must not contain commas.
$mainMod = SUPER

# --- apps ---
bindd = ALT, TAB, Cycle windows, cyclenext
bindd = ALT SHIFT, TAB, Cycle windows backwards, cyclenext, prev
bindd = $mainMod, Return, Terminal (new tmux session), exec, $terminal -e tmux new-session -s "term-$(date +%s%N)"
bindd = $mainMod SHIFT, Return, Terminal (attach tmux), exec, $terminal -e tmux attach
bindd = $mainMod SHIFT, T, Terminal as user td, exec, $terminal -e su - td -c "tmux set-environment -g XDG_RUNTIME_DIR /run/user/1000; tmux set-environment -g WAYLAND_DISPLAY wayland-1; tmux source-file ~/.config/tmux/tmux.conf; exec tmux new-session -A -s main"
bindd = $mainMod, G, Browser, exec, $browser
bindd = $mainMod, E, File manager (yazi), exec, $fileManagerTerminal
bindd = $mainMod SHIFT, E, File manager (nemo), exec, $fileManagerGUI
bindd = $mainMod, space, App launcher, exec, $menu
bindd = $mainMod, T, Telegram, exec, telegram-desktop
bindd = $mainMod, S, YouTube Music, exec, if pgrep -x "ytm" > /dev/null; then hyprctl dispatch focuswindow "class:YTMDesktop"; else flatpak run app.ytmdesktop.ytmdesktop; fi
bindd = $mainMod, N, Obsidian, exec, obsidian
bindd = $mainMod, O, Reload wallpaper, exec, pgrep swaybg && killall swaybg; $wallpaper
bindd = $mainMod, B, Toggle waybar, exec, pkill -SIGUSR1 waybar

# --- session and system ---
bindd = $mainMod, Escape, Lock screen, exec, pidof hyprlock || hyprlock
bindd = $mainMod SHIFT, Escape, Power menu, exec, $scripts/powermenu.sh
bindd = , XF86PowerOff, Power menu, exec, $scripts/powermenu.sh
bindd = $mainMod SHIFT, U, System update (sysup), exec, $tui zsh -ic 'sysup; read -k1'
bindd = $mainMod CTRL, I, Toggle idle lock (hypridle), exec, $scripts/idle-toggle.sh
bindd = $mainMod SHIFT, N, Toggle night light, exec, pkill -x hyprsunset || hyprsunset -t 4500
bindd = $mainMod, X, Dismiss notification, exec, dunstctl close
bindd = $mainMod SHIFT, X, Notification history, exec, dunstctl history-pop
bindd = $mainMod CTRL, X, Toggle do-not-disturb, exec, dunstctl set-paused toggle

# --- TUIs and pickers ---
bindd = $mainMod, A, Audio mixer (wiremix), exec, $tui wiremix
bindd = $mainMod SHIFT, B, Bluetooth (bluetui), exec, $tui bluetui
bindd = $mainMod, I, Wi-Fi (nmtui), exec, $tui nmtui
bindd = $mainMod, D, System monitor (btop), exec, $tui btop
bindd = $mainMod, P, Project sessions (tmux), exec, $terminal -e ~/.config/tmux/scripts/sessionizer.sh
bindd = $mainMod, C, Clipboard history, exec, $scripts/clipboard.sh
bindd = $mainMod SHIFT, C, Color picker, exec, hyprpicker -a
bindd = $mainMod, period, Emoji picker, exec, rofimoji
bindd = $mainMod, slash, Keybind cheatsheet, exec, $scripts/keybinds.sh

# --- capture ---
bindd = , Print, Screenshot region, exec, hyprshot -m region -o ~/pics/screenshots
bindd = SHIFT, Print, Screenshot active monitor, exec, hyprshot -m output -m active -o ~/pics/screenshots
bindd = $mainMod, Print, Screenshot active window, exec, hyprshot -m window -m active -o ~/pics/screenshots
bindd = $mainMod SHIFT, S, Screenshot region then annotate, exec, grim -g "$(slurp)" - | satty -f - --copy-command wl-copy --output-filename ~/pics/screenshots/%F_%T.png
bindd = $mainMod, R, Record screen (toggle), exec, $scripts/rec-toggle.sh
bindd = $mainMod SHIFT, R, Record region (toggle), exec, $scripts/rec-toggle.sh region

# --- windows ---
bindd = $mainMod, W, Close window, killactive
bindd = $mainMod, V, Toggle floating, togglefloating
bindd = $mainMod, F, Fullscreen, fullscreen
bindd = $mainMod SHIFT, F, Maximize (keep bar), fullscreen, 1
bindd = $mainMod SHIFT, P, Pin floating window, pin
bindd = $mainMod, U, Focus urgent or last window, focusurgentorlast
bindd = $mainMod, Y, Toggle group (tabs), togglegroup
bindd = $mainMod SHIFT, Y, Next tab in group, changegroupactive, f

bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, J, Focus down, movefocus, d

bindd = $mainMod SHIFT, H, Move window left, movewindow, l
bindd = $mainMod SHIFT, L, Move window right, movewindow, r
bindd = $mainMod SHIFT, K, Move window up, movewindow, u
bindd = $mainMod SHIFT, J, Move window down, movewindow, d

# --- resize: held keys repeat (binde); the submap "resize" is shown by waybar ---
binded = $mainMod, left, Resize left, resizeactive, -20 0
binded = $mainMod, right, Resize right, resizeactive, 20 0
binded = $mainMod, up, Resize up, resizeactive, 0 -20
binded = $mainMod, down, Resize down, resizeactive, 0 20
binded = $mainMod SHIFT, left, Resize left (big), resizeactive, -50 0
binded = $mainMod SHIFT, right, Resize right (big), resizeactive, 50 0
binded = $mainMod SHIFT, up, Resize up (big), resizeactive, 0 -50
binded = $mainMod SHIFT, down, Resize down (big), resizeactive, 0 50
binded = $mainMod CTRL, H, Resize left, resizeactive, -40 0
binded = $mainMod CTRL, L, Resize right, resizeactive, 40 0
binded = $mainMod CTRL, K, Resize up, resizeactive, 0 -40
binded = $mainMod CTRL, J, Resize down, resizeactive, 0 40

bindd = $mainMod CTRL, R, Resize mode (Esc to leave), submap, resize
submap = resize
binded = , h, Resize left, resizeactive, -40 0
binded = , l, Resize right, resizeactive, 40 0
binded = , k, Resize up, resizeactive, 0 -40
binded = , j, Resize down, resizeactive, 0 40
binded = , left, Resize left, resizeactive, -40 0
binded = , right, Resize right, resizeactive, 40 0
binded = , up, Resize up, resizeactive, 0 -40
binded = , down, Resize down, resizeactive, 0 40
bindd = , escape, Leave resize mode, submap, reset
bindd = , Return, Leave resize mode, submap, reset
submap = reset

# --- scratchpads ---
bindd = $mainMod, grave, Toggle scratch workspace, togglespecialworkspace, scratch
bindd = $mainMod SHIFT, grave, Send window to scratch, movetoworkspace, special:scratch
bindd = $mainMod, Z, Drop-down terminal (tmux scratch), togglespecialworkspace, term

# --- monitors ---
bindd = $mainMod, bracketleft, Focus previous monitor, focusmonitor, -1
bindd = $mainMod, bracketright, Focus next monitor, focusmonitor, +1
bindd = $mainMod SHIFT, bracketleft, Move window to previous monitor, movewindow, mon:-1
bindd = $mainMod SHIFT, bracketright, Move window to next monitor, movewindow, mon:+1
bindd = $mainMod CTRL, bracketleft, Move workspace to previous monitor, movecurrentworkspacetomonitor, -1
bindd = $mainMod CTRL, bracketright, Move workspace to next monitor, movecurrentworkspacetomonitor, +1

# Workspaces 1-10 on SUPER+digit, 11-20 on SUPER+ALT+digit; SHIFT moves the active window
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10
bindd = $mainMod ALT, 1, Workspace 11, workspace, 11
bindd = $mainMod ALT, 2, Workspace 12, workspace, 12
bindd = $mainMod ALT, 3, Workspace 13, workspace, 13
bindd = $mainMod ALT, 4, Workspace 14, workspace, 14
bindd = $mainMod ALT, 5, Workspace 15, workspace, 15
bindd = $mainMod ALT, 6, Workspace 16, workspace, 16
bindd = $mainMod ALT, 7, Workspace 17, workspace, 17
bindd = $mainMod ALT, 8, Workspace 18, workspace, 18
bindd = $mainMod ALT, 9, Workspace 19, workspace, 19
bindd = $mainMod ALT, 0, Workspace 20, workspace, 20
bindd = $mainMod, TAB, Previous workspace, workspace, prev

bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10
bindd = $mainMod SHIFT ALT, 1, Move window to workspace 11, movetoworkspace, 11
bindd = $mainMod SHIFT ALT, 2, Move window to workspace 12, movetoworkspace, 12
bindd = $mainMod SHIFT ALT, 3, Move window to workspace 13, movetoworkspace, 13
bindd = $mainMod SHIFT ALT, 4, Move window to workspace 14, movetoworkspace, 14
bindd = $mainMod SHIFT ALT, 5, Move window to workspace 15, movetoworkspace, 15
bindd = $mainMod SHIFT ALT, 6, Move window to workspace 16, movetoworkspace, 16
bindd = $mainMod SHIFT ALT, 7, Move window to workspace 17, movetoworkspace, 17
bindd = $mainMod SHIFT ALT, 8, Move window to workspace 18, movetoworkspace, 18
bindd = $mainMod SHIFT ALT, 9, Move window to workspace 19, movetoworkspace, 19
bindd = $mainMod SHIFT ALT, 0, Move window to workspace 20, movetoworkspace, 20

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- hardware keys (swayosd draws the OSD; plain tools are the fallback) ---
bindeld = , XF86AudioRaiseVolume, Volume up, exec, swayosd-client --output-volume raise --max-volume 140 || wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute output, exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld = , XF86AudioMicMute, Mute microphone, exec, swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindd = $mainMod SHIFT, M, Mute microphone, exec, swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, exec, swayosd-client --brightness raise || brightnessctl set +10%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, swayosd-client --brightness lower || brightnessctl set 10%-
bindld = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Pause, exec, playerctl pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
