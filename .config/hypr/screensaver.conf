# Clock-only idle screensaver (no password field, OLED). Palette: everforest-black.
# Started by scripts/screensaver.sh (hyprlock --grace); dismissed by input without auth.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(d3c6aa)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(859289)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(6b7770)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -24, 16
    halign = right
    valign = bottom
}
