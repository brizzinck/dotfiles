general {
    # lock_cmd is only for a manual `loginctl lock-session`; idle never locks
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    # honour video/browser idle inhibitors
    ignore_dbus_inhibit = false
    ignore_wayland_inhibit = false
}

# Idle never locks with a password and never suspends: the machine keeps
# running (agents, builds) while the clock screensaver or a dark panel is shown.
# Every listener is skipped while media plays / automation Chrome runs.

# dim
listener {
    timeout = 150
    on-timeout = brightnessctl -e4 -s set 25%
    on-resume = brightnessctl -r
    condition_cmd = ~/.config/hypr/idle-allowed.sh
    condition_retry = 30
}

# clock screensaver, no password; any input dismisses it
listener {
    timeout = 300
    on-timeout = ~/.config/hypr/scripts/screensaver.sh start
    on-resume = ~/.config/hypr/scripts/screensaver.sh stop
    condition_cmd = ~/.config/hypr/idle-allowed.sh
    condition_retry = 30
}

# OLED protection: panel off after 20 min (only blanks the display)
listener {
    timeout = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    condition_cmd = ~/.config/hypr/idle-allowed.sh
    condition_retry = 30
}
