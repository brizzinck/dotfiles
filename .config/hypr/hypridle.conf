general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3                   # delay suspend until the screen is locked
}

# dim
listener {
    timeout = 150
    on-timeout = brightnessctl -e4 -s set 25%
    on-resume = brightnessctl -r
    condition_cmd = ~/.config/hypr/no_idle_while_chrome.sh
    condition_retry = 30
}

# lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    condition_cmd = ~/.config/hypr/no_idle_while_chrome.sh
    condition_retry = 30
}

# screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
    condition_cmd = ~/.config/hypr/no_idle_while_chrome.sh
    condition_retry = 30
}

# suspend after 15 min, on battery only
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/suspend-on-battery.sh
    condition_cmd = ~/.config/hypr/no_idle_while_chrome.sh
    condition_retry = 30
}
