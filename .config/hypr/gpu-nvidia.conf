# NVIDIA-only environment. Not sourced by default: on AMD, LIBVA_DRIVER_NAME=nvidia breaks
# VA-API (browsers, mpv, gpu-screen-recorder fall back to CPU decode).
# Enabled by install.sh through host.conf when an NVIDIA GPU is detected.
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = __GL_GSYNC_ALLOWED,1

cursor {
    no_hardware_cursors = true
}
