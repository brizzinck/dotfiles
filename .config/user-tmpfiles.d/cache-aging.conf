# Age-based cleanup of regenerable caches (systemd-tmpfiles --user, run by systemd-tmpfiles-clean.timer).
# Type e only ages entries that already exist. Whole install directories (go-build, ms-playwright, camoufox,
# huggingface, nvim/mason) are deliberately not listed: tools expect them complete.
e %C/pip/http-v2          - - - 30d
e %h/.npm/_npx            - - - 30d
e %h/.npm/_cacache        - - - 60d
e %C/yay                  - - - 30d
e %C/thumbnails           - - - 60d
# Opt-in, off by default (the owner keeps Trash and Downloads untouched):
# e %h/.local/share/Trash/files - - - 30d
# e %h/.local/share/Trash/info  - - - 30d
