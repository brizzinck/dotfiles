# DEV-d: the per-run directory of a `ci` run holds gitlab-ci-local's variables.yml (secrets) while it runs. `ci` removes it on exit
# and INT/TERM/HUP, and every dev launcher removes the directories of dead processes at its start; this is the net under that
# for a SIGKILLed run when no launcher is started again: with linger on, /run/user/UID survives logout. A run is never older.
# (Only ci-*: a posting or db run directory may legitimately sit idle for days.)
e %t/devtools/ci-* - - - 1d
