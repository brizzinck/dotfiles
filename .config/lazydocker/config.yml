# Everforest v2: ANSI colour names on purpose (green = focus, black = ANSI 0 = select, blue = info), so the terminal
# palette decides and `theme black|night` needs no file here (lazydocker has no include / multi-file config).
gui:
  theme:
    activeBorderColor: [green, bold]
    inactiveBorderColor: [black]
    selectedLineBgColor: [black]
    optionsTextColor: [blue]
