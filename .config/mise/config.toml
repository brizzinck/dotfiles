# Global mise settings (DEV-b; stowed, also linked for managed users by the cli profile). No [tools]: outside a project the
# system toolchains stay in charge (pacman go, nodejs, python; rustup for Rust). Projects pin versions in .mise.toml.
[settings]
idiomatic_version_file_enable_tools = ["node", "python"]   # .nvmrc / .node-version / .python-version
auto_install = true             # mise exec / mise run / shims install a missing pinned version on first use
not_found_auto_install = true
trusted_config_paths = []       # never auto-trust: `mise trust` per project (envs init / envs bind do it)
jobs = 4

[settings.status]
missing_tools = "always"
show_env = false
show_tools = false
