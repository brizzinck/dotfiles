# Voxtype (AUR voxtype-bin): offline dictation with a local Whisper model, typed into the focused window with wtype.
# Hyprland owns the keys (SUPER+ALT+D toggle, hold F9), so the daemon's own hotkey is off. The daemon is started by the
# user unit voxtype.service through `dictation.sh run`, which copies this file to $XDG_RUNTIME_DIR/voxtype/config.toml with
# the language (SUPER+ALT+SHIFT+D cycles ru > uk > en, ~/.local/state/dictation/lang) and the model (menu, ~/.local/state/dictation/model)
# the owner chose before the best voxtype binary (GPU Vulkan, else avx512/avx2/baseline) runs `daemon` on it.
# The model: ~/.local/share/voxtype/models/ggml-small.bin (multilingual, ~466 MB; dictation.sh model downloads it); the menu also
# offers large-v3-turbo (1.6 GB), see CLAUDE.md "Dictation" for the benchmark.
# The same file serves the planned Telegram voice transcription (M1), see HANDOFF.md.
state_file = "auto"            # $XDG_RUNTIME_DIR/voxtype/state: idle | recording | transcribing (waybar custom/dictation)

[hotkey]
enabled = false

[audio]
device = "default"
max_duration_secs = 60

[whisper]
model = "small"
language = "ru"                # default; replaced by the remembered choice: ru | uk | en | auto | a comma list like en,ru,uk (auto-detect misfires on short clips)

[vad]
# Voice-activity check before Whisper: a recording without speech is dropped instead of transcribed, so Whisper's silence
# hallucinations ("Субтитры субтитров Н.Новикова", 2026-11-06) never get pasted. energy (RMS, no model) only accepts or rejects
# the whole recording; the Silero backend ("whisper", voxtype setup vad) was tried first and the next dictation lost its
# punctuation and the start of a word ("не знаю, может" -> "за может"), which looks like speech-segment cutting.
enabled = true
backend = "energy"

[output]
# paste, not type: wtype gives every character a made-up keycode (the 1st new character gets keycode 9, the 14th 22 ...), and
# ghostty reads the PHYSICAL key from the keycode, so characters that land on the BackSpace, Tab, Control_L or Alt_L codes vanish
# (2026-11-06: "это просто" came out as "э прс" while the journal held the right text). The text goes through the clipboard and
# one Ctrl+Shift+V (terminals: ghostty default + layout-keys.conf; Zen, Electron, Telegram: paste as plain text); the previous
# clipboard comes back afterwards.
mode = "paste"
paste_keys = "ctrl+shift+v"
restore_clipboard = true
restore_clipboard_delay_ms = 300
fallback_to_clipboard = true
