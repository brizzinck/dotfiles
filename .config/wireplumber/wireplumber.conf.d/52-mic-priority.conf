# Microphone priorities (AUDIO2): the default source is always the best REAL microphone, EasyEffects follows it
# (useDefaultInputDevice) and moves every recording app into easyeffects_source (processAllInputs), see CLAUDE.md "Audio".
# Order (highest wins): USB microphone 2600 > Bluetooth headset loopback source 2010 (WirePlumber's own value, no rule needed)
# > built-in codec microphone 1000 (the stock 2009 would beat a Bluetooth headset) > USB webcam microphone 900
# > easyeffects_source 0 (set by EasyEffects itself). Plugging the headset jack switches the route inside the built-in
# node (port "analog-input-mic"), so the node name and EasyEffects' input stay the same.
# The login autostart (audio-ensure --boot) clears the stored default-source choice, so these priorities decide at every login;
# a manual pick in the input picker pins the source for the session, "Automatic" (ee-ctl auto) undoes it.
# Later rules override earlier ones for the same node (the webcam rule wins over the generic USB rule).
# Revert: delete this file and `systemctl --user restart wireplumber`. Check: `wpctl status`, `pw-dump | jq` priority.session.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-.*" } ]
    actions = { update-props = { priority.session = 2600 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-.*([Ww]ebcam|[Cc]amera|[Cc]am_).*" } ]
    actions = { update-props = { priority.session = 900 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_04_00.6.analog-stereo" } ]
    actions = { update-props = { priority.session = 1000 } }
  }
]
