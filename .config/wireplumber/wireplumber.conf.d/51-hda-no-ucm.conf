# LENOVO 83HY (IdeaPad Slim 5 16AKP10): the built-in microphone is a digital mic on the Conexant SN6140 HDA codec
# (pin 0x1a, "Mic at Int Top", card 1 "SN6140 Analog"). The Ryzen ACP also exposes a PDM capture card (card 2,
# acp-pdm-mach), but nothing is wired to it: raw capture from hw:acppdmmach is a constant rail (-2^31, 5 distinct values).
# alsa-ucm-conf's HDA profile assumes "an ACP card exists, so the DMIC is on the ACP": it names the ACP PDM "Mic1"
# (CapturePCM hw:acppdmmach, the default source) and never offers the codec's own internal mic. Dictation and calls got a
# dead DC signal (Whisper then hallucinates "Subtitles ..." from silence).
# Fix: do not use UCM for this card. The classic ALSA card profile then exposes the codec's real "Internal Microphone"
# port (and "Microphone" for the headset jack) on one source, speaker and headphones on one sink.
# Revert: delete this file and `systemctl --user restart wireplumber`. Check: `audio-ensure --mic`, doctor `audio-mic`.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_04_00.6" } ]
    actions = { update-props = { api.alsa.use-ucm = false } }
  }
]
